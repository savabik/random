<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Want To Meet Me?</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500&display=swap');

        :root {
            --primary-color: #4a0e4a;
            --secondary-color: #ff69b4;
            --bg-color: #2a0a2a;
            --bg-color-2: #1a061e;
        }

        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-color-2) 0%, var(--bg-color) 45%, var(--primary-color) 100%);
            background-attachment: fixed;
            color: #fff;
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 3rem;
            margin-bottom: 2rem;
            color: var(--secondary-color);
            text-shadow: 2px 2px 10px rgba(255, 105, 180, 0.35);
            transition: opacity 0.4s ease;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            padding: 12px 32px;
            margin: 12px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        #yesBtn {
            background: linear-gradient(135deg, var(--secondary-color), #ff1493);
            color: #fff;
            box-shadow: 0 4px 18px rgba(255, 105, 180, 0.35);
        }

        #yesBtn:hover {
            box-shadow: 0 4px 26px rgba(255, 105, 180, 0.65);
            transform: translateY(-2px);
        }

        #noBtn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            position: absolute;
        }

        #noBtn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #loveMessage {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 2.1rem;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            opacity: 0;
            transition: opacity 0.6s ease;
            color: var(--secondary-color);
        }

        #planForm {
            display: none;
            flex-direction: column;
            align-items: stretch;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 105, 180, 0.3);
            padding: 34px 38px;
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 320px;
            max-width: 90vw;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        #planForm.show {
            opacity: 1;
            transform: translateY(0);
        }

        .field-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 22px;
            text-align: left;
        }

        #planForm label {
            font-size: 0.8rem;
            margin-bottom: 9px;
            color: var(--secondary-color);
            opacity: 0.95;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrap .icon {
            position: absolute;
            left: 14px;
            font-size: 1rem;
            pointer-events: none;
            opacity: 0.85;
            z-index: 1;
        }

        #planForm input[type="date"],
        #planForm input[type="text"] {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            padding: 12px 14px 12px 40px;
            border: 1.5px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            width: 100%;
            outline: none;
            background: rgba(255, 255, 255, 0.06);
            color: #fdeef6;
            color-scheme: dark;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        #planForm input[type="text"]::placeholder {
            color: rgba(253, 238, 246, 0.4);
        }

        #planForm input[type="date"]:hover,
        #planForm input[type="text"]:hover {
            background: rgba(255, 255, 255, 0.09);
        }

        #planForm input[type="date"]:focus,
        #planForm input[type="text"]:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px rgba(255, 105, 180, 0.2);
            background: rgba(255, 255, 255, 0.09);
        }

        #planForm input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.3) sepia(1) saturate(4) hue-rotate(280deg);
            cursor: pointer;
        }

        #sendBtn {
            background: linear-gradient(135deg, var(--secondary-color), #ff1493);
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            font-size: 1.05rem;
            padding: 13px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            margin-top: 4px;
            align-self: center;
            box-shadow: 0 4px 18px rgba(255, 105, 180, 0.3);
        }

        #sendBtn:hover {
            box-shadow: 0 4px 26px rgba(255, 105, 180, 0.6);
            transform: translateY(-2px) scale(1.03);
        }

        #fieldWarning {
            font-size: 0.85rem;
            color: #ffb3d1;
            margin-top: -8px;
            margin-bottom: 14px;
            min-height: 1em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #checkmark {
            width: 70px;
            height: 70px;
            opacity: 0;
            transform: scale(0.6);
            transition: opacity 0.4s ease, transform 0.4s ease;
            margin-top: 1.5rem;
        }

        #checkmark.show {
            opacity: 1;
            transform: scale(1);
        }

        .heart {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            animation: float 4s ease-in infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background-color: #fff;
            pointer-events: none;
            opacity: 0;
            animation: twinkle 0.8s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="mainTitle">Do You Want To Meet Me?</h1>
        <div id="askButtons">
            <button id="yesBtn" class="btn">Yes</button>
            <button id="noBtn" class="btn">No</button>
        </div>

        <div id="loveMessage"></div>

        <div id="planForm">
            <div class="field-group">
                <label for="dateInput">📅 Kobe dekha korbe?</label>
                <div class="input-wrap">
                    <input type="date" id="dateInput">
                </div>
            </div>

            <div class="field-group">
                <label for="placeInput">📍 Kothay dekha korbe?</label>
                <div class="input-wrap">
                    <span class="icon">📍</span>
                    <input type="text" id="placeInput" placeholder="Jekhane dekha korte chao...">
                </div>
            </div>

            <div id="fieldWarning"></div>

            <button id="sendBtn">Send</button>
        </div>

        <svg id="checkmark" viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="24" fill="none" stroke="#ff69b4" stroke-width="3"/>
            <path fill="none" stroke="#ff69b4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M14 27l8 8 16-16"/>
        </svg>
    </div>

    <script>
        const mainTitle = document.getElementById('mainTitle');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const askButtons = document.getElementById('askButtons');
        const loveMessage = document.getElementById('loveMessage');
        const planForm = document.getElementById('planForm');
        const dateInput = document.getElementById('dateInput');
        const placeInput = document.getElementById('placeInput');
        const sendBtn = document.getElementById('sendBtn');
        const fieldWarning = document.getElementById('fieldWarning');
        const checkmark = document.getElementById('checkmark');

        const recipientEmail = 'sakirulislamapon@gmail.com';

        yesBtn.addEventListener('click', () => {
            mainTitle.style.display = 'none';
            loveMessage.textContent = 'ok! Ekhon bolo, kobe r kothay dekha korte chao 🙂';
            loveMessage.style.opacity = '1';
            askButtons.style.display = 'none';
            planForm.style.display = 'flex';
            requestAnimationFrame(() => planForm.classList.add('show'));
            createHearts();
            createSparkles();
        });

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('click', moveButton);

        function moveButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth;
            const maxY = window.innerHeight - noBtn.offsetHeight;
            const newX = Math.random() * maxX;
            const newY = Math.random() * maxY;

            noBtn.style.position = 'fixed';
            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        }

        sendBtn.addEventListener('click', () => {
            const dateVal = dateInput.value;
            const placeVal = placeInput.value.trim();

            if (!dateVal || !placeVal) {
                fieldWarning.textContent = 'Please date ar place dutai fill up koro!';
                fieldWarning.style.opacity = '1';
                return;
            }

            fieldWarning.style.opacity = '0';

            const subject = encodeURIComponent('Meeting Confirmed!');
            const body = encodeURIComponent(
                `Se meet korte razi hoyeche!\n\nDate: ${dateVal}\nPlace: ${placeVal}`
            );
            const mailtoLink = `mailto:${recipientEmail}?subject=${subject}&body=${body}`;

            window.location.href = mailtoLink;

            planForm.classList.remove('show');
            setTimeout(() => {
                planForm.style.display = 'none';
                loveMessage.style.opacity = '0';
                checkmark.classList.add('show');
            }, 400);
        });

        function createHearts() {
            setInterval(() => {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.classList.add('heart');
                heart.style.left = Math.random() * window.innerWidth + 'px';
                heart.style.fontSize = (Math.random() * 30 + 10) + 'px';
                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }, 300);
        }

        function createSparkles() {
            setInterval(() => {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                sparkle.style.left = Math.random() * window.innerWidth + 'px';
                sparkle.style.top = Math.random() * window.innerHeight + 'px';
                document.body.appendChild(sparkle);

                setTimeout(() => {
                    sparkle.remove();
                }, 800);
            }, 50);
        }

        function createBackgroundEffect() {
            const effect = document.createElement('div');
            effect.style.position = 'fixed';
            effect.style.width = '2px';
            effect.style.height = '2px';
            effect.style.background = `radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%)`;
            effect.style.left = Math.random() * window.innerWidth + 'px';
            effect.style.top = Math.random() * window.innerHeight + 'px';
            effect.style.borderRadius = '50%';
            effect.style.pointerEvents = 'none';
            effect.style.opacity = 0;
            document.body.appendChild(effect);

            let scale = 0;
            let opacity = 0.8;

            function animate() {
                scale += 0.03;
                opacity -= 0.01;
                effect.style.transform = `scale(${scale})`;
                effect.style.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animate);
                } else {
                    effect.remove();
                }
            }

            animate();
        }

        setInterval(createBackgroundEffect, 200);
    </script>
</body>
</html>
